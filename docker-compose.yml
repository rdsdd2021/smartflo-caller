services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartflo_backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/smartflo_db.sqlite
      - EXCEL_PATH=/app/data/smartflo_dtmf_records.xlsx
    volumes:
      - smartflo_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartflo_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"

  proxy:
    image: caddy:2-alpine
    container_name: smartflo_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  smartflo_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
